<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GreenSuite</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      background-color: #ffffff;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    img {
      max-width: 480px;
      width: 90%;
      height: auto;
      transform: rotate(90deg);
    }

    footer {
      text-align: center;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <main>
    <img src="images/greensuite.png" alt="GreenSuite">
  </main>
  <footer>Copyright 2026. Global Water Technologies. All Rights Reserved.</footer>
</body>
</html>
