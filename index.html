<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GreenSuite</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      background-color: #ffffff;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    img {
      max-width: 480px;
      width: 90%;
      height: auto;
      transform: rotate(90deg);
    }

    .tagline {
      max-width: 640px;
      width: 90%;
      margin-top: 32px;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 18px;
      line-height: 1.5;
      color: #333;
    }

    footer {
      text-align: center;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <main>
    <img src="images/greensuite.png" alt="GreenSuite">
    <p class="tagline">A new development platform for agentic and other AI tools to improve water technology and sustainability solutions. Watch this space for updates and opportunities.</p>
  </main>
  <footer>
    <div>Copyright 2026. <a href="https://gwtr.com">Global Water Technologies</a>. All Rights Reserved.</div>
    <div>Created by Claude AI... thanks, Claude.</div>
  </footer>
</body>
</html>
